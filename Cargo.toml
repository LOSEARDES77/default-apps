[package]
name = "default-apps"
version = "0.1.1"
edition = "2024"
description = "Choose which applications open your files and links"
license = "MIT"
authors = ["loseardes77 <loseardes77@gmail.com>"]
repository = "https://github.com/LOSEARDES77/default-apps"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
gtk = { version = "0.11.5", package = "gtk4" }

# `cargo deb` (run it on Debian/Ubuntu; library dependencies are detected)
[package.metadata.deb]
section = "utils"
assets = [
  [
    "target/release/default-apps",
    "usr/bin/",
    "755",
  ],
  [
    "data/dev.loseardes77.DefaultApps.desktop",
    "usr/share/applications/",
    "644",
  ],
  [
    "data/dev.loseardes77.DefaultApps.svg",
    "usr/share/icons/hicolor/scalable/apps/",
    "644",
  ],
]

# `cargo generate-rpm` (run it on Fedora after `cargo build --release`)
[package.metadata.generate-rpm]
assets = [
  { source = "target/release/default-apps", dest = "/usr/bin/default-apps", mode = "755" },
  { source = "data/dev.loseardes77.DefaultApps.desktop", dest = "/usr/share/applications/dev.loseardes77.DefaultApps.desktop", mode = "644" },
  { source = "data/dev.loseardes77.DefaultApps.svg", dest = "/usr/share/icons/hicolor/scalable/apps/dev.loseardes77.DefaultApps.svg", mode = "644" },
]
